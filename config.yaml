# ---- Trading Assistant config ----
# Symbols use Yahoo Finance tickers (crypto: BTC-USD, ETH-USD).
watchlist: [SPY, QQQ, AAPL, MSFT, NVDA, BTC-USD]
benchmark: SPY
start_date: "2015-01-01"
db_path: data/trading.db

backtest:
  initial_capital: 4000      # mirrors the real stake
  cost_bps: 5                # assumed cost per trade (slippage + spread), in basis points

strategies:
  sma_crossover:
    fast: 50
    slow: 200
  rsi_reversion:
    period: 14
    buy_below: 30
    sell_above: 55
  momentum:
    lookback: 252
    skip: 21
  vol_target:
    target_vol: 0.15
    window: 20

# Out-of-sample testing: pick parameters on train_years, trade them on the next test_years.
walk_forward:
  train_years: 5
  test_years: 1
  grids:
    sma_crossover: {fast: [20, 50], slow: [100, 200]}
    rsi_reversion: {period: [7, 14], buy_below: [25, 30], sell_above: [50, 55, 70]}
    momentum: {lookback: [126, 252], skip: [0, 21]}
    vol_target: {target_vol: [0.10, 0.15, 0.20], window: [20, 60]}

# LLM research layer: reads recent news and writes a stance with reasons.
# Advisory only: notes are logged and scored, the bot does not trade on them.
research:
  # Tried in order. Each model has its own free quota (about 5 a minute and
  # 20 a day), so a busy or used-up model falls through to the next.
  models: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.5-flash, gemini-3.5-flash-lite]
  requests_per_minute: 5       # per model; calls are spaced to stay under it
  news_lookback_days: 3        # covers a weekend
  max_news_items: 12           # per symbol, most focused and newest first

# News test (research only): does past news predict the next session's move?
# The universe is the Dow 30 as it stood on the start date. Fixing the list up
# front means the choice of stocks uses no hindsight about who did well later.
news_test:
  start: "2020-01-01"
  universe: [AAPL, AXP, BA, CAT, CSCO, CVX, DIS, DOW, GS, HD, IBM, INTC, JNJ, JPM, KO,
             MCD, MMM, MRK, MSFT, NKE, PFE, PG, RTX, TRV, UNH, V, VZ, WBA, WMT, XOM]
  aliases: {UTX: RTX}          # old ticker -> today's, for news tagged before the rename
  archive_path: data/news_archive.db

# Named lists of symbols, used by the league bots below.
universes:
  core: [SPY, QQQ, AAPL, MSFT, NVDA]
  # 30 large US companies across every sector (the Dow 30 list as of late 2024).
  large30: [AAPL, AMGN, AMZN, AXP, BA, CAT, CRM, CSCO, CVX, DIS, GS, HD, HON, IBM, JNJ,
            JPM, KO, MCD, MMM, MRK, MSFT, NKE, NVDA, PG, SHW, TRV, UNH, V, VZ, WMT]
  # 20 funds: US and foreign shares, bonds, gold, and the US sectors.
  etfs: [SPY, QQQ, IWM, DIA, EFA, EEM, TLT, IEF, LQD, GLD,
         XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLU, XLB, XLRE]

  # The S&P 500 as it was listed at the end of 2015 (504 tickers of that day, including
  # companies that were later bought or delisted). Built by scripts/build_universe.py.
  sp500_2016: "file:universes/sp500_2016.txt"

# The ranking model: each day it scores every stock in a wide universe from
# price and volume history (the candlestick shapes and money-flow measures, as
# numbers) and the league's rank-* bots hold the highest scores.
#   python main.py model-fetch    download / refresh the universe's prices (Alpaca)
#   python main.py model-test     walk-forward test -> reports/model_test_report.md
# Every score for a day comes from a model trained only on earlier years.
# These settings were fixed before the first test run. Tuning them against the
# test results would make the test meaningless.
model:
  universe: sp500_2016
  prices_path: data/model_prices.db
  start: "2016-01-01"          # Alpaca's daily history begins here
  asof: "2016-01-04"           # tickers are read as they were on this day
  break_ratio: 3.0             # a close 3x the previous one (or a third of it) is a data break:
                               # the stock's history ends there (see tradebot/modeldata.py)
  horizon_days: 5              # predict which stocks do best over the next week
  first_test_year: 2019        # 2016-2018 train the first model
  top_n: 25                    # the test's "top" group, and what a rank bot holds
  models:
    ridge: {alpha: 100.0}      # a straight-line model
    gbm: {max_iter: 200, learning_rate: 0.03, max_leaf_nodes: 16, min_samples_leaf: 500,
          l2_regularization: 1.0}   # boosted trees: can use combinations of inputs
    # Phase 6b (fixed 2026-11-18, before their first test run): the same two models, also given
    # the nine numbers from company filings (see `fundamentals` below). Their settings are copied
    # from the price-only models above, so the inputs are the only difference between each pair.
    ridge-fund: {kind: ridge, inputs: [price, fundamentals], alpha: 100.0}
    gbm-fund: {kind: gbm, inputs: [price, fundamentals], max_iter: 200, learning_rate: 0.03,
               max_leaf_nodes: 16, min_samples_leaf: 500, l2_regularization: 1.0}

# Company filings for the ranking model (tradebot/fundamentals.py), from SEC EDGAR.
#   python main.py fundamentals-fetch    download all, then refresh only the companies that filed
# Each number counts from the first trading day after its filing date; a restated number only
# from the restating filing's date. Fixed 2026-11-18, before the first test run.
fundamentals:
  path: data/fundamentals.db
  ciks: universes/sp500_2016_ciks.csv   # SEC numbers from the same 2015 list as the universe
  successors: universes/sp500_2016_cik_successors.csv   # where a company later moved to a new SEC number
  max_age_days: 365          # a number for a period that ended longer ago than this counts as unknown
  float_max_age_days: 730    # the float is reported once a year, as of mid-year, so it may be older

# The bot league: simulated bots that follow the paper bot's rules (decide after
# the close, trade at the next open, same position cap, stop-loss and costs),
# each with its own strategy and list of symbols. Fills are simulated from stored
# prices, so no broker account is needed. `python main.py league` replays them.
# Changing a bot's line restarts its live record. A bot may also set:
#   params: {fast: 20}         strategy settings, in place of `strategies` above
#   risk: {max_position_pct: 0.10}
#   stop_loss: false
#   start: "2019-01-01"        begin later than history_start
#   model: ridge               a rank bot: follow that ranking model (see `model` above)
#   top_n: 25, rebalance_days: 5
league:
  start_cash: 100000
  history_start: "2016-01-04"   # prices start in 2015; the first year warms up the indicators
  bots:
    - {name: trend-core, strategy: sma_crossover, universe: core}     # the paper bot's twin
    - {name: trend-large30, strategy: sma_crossover, universe: large30}
    - {name: momentum-large30, strategy: momentum, universe: large30}
    - {name: dip-large30, strategy: rsi_reversion, universe: large30}
    - {name: calm-large30, strategy: vol_target, universe: large30}
    - {name: trend-etfs, strategy: sma_crossover, universe: etfs}
    - {name: momentum-etfs, strategy: momentum, universe: etfs}
    - {name: hold-large30, strategy: buy_and_hold, universe: large30, stop_loss: false}   # baseline
    # Rank bots hold the 25 stocks the ranking model scores highest and re-pick every 5 days.
    # They start in 2019, the first year the model was scored without hindsight.
    - {name: rank-ridge, model: ridge, universe: sp500_2016}
    - {name: rank-gbm, model: gbm, universe: sp500_2016}
    - {name: hold-sp500, strategy: buy_and_hold, universe: sp500_2016, stop_loss: false,
       start: "2019-01-01"}                                                               # their baseline
    # The same rank bots following the models that also read company filings (Phase 6b).
    - {name: rank-ridge-fund, model: ridge-fund, universe: sp500_2016}
    - {name: rank-gbm-fund, model: gbm-fund, universe: sp500_2016}

# Alerts: a failed daily run, a stop-loss, a day the bot refused to trade.
# Every alert is kept in the database and logs/alerts.log. To also get them on a
# phone, set NTFY_TOPIC or DISCORD_WEBHOOK_URL in .env (see .env.example).
alerts:
  desktop: true          # a Windows notification on this PC
  daily_summary: true    # also send a short "all ok" after each good run, so silence means trouble

# Hard limits enforced by the paper/live bot before any order is sent.
risk:
  max_position_pct: 0.20       # no single symbol above 20% of equity
  max_total_exposure_pct: 1.0  # no margin
  max_risk_per_position_pct: 0.015  # stop-loss = this / max_position_pct = 7.5%
  stop_cooldown_bars: 20       # after a stop, stay out of that symbol this many bars
  daily_loss_limit_pct: 0.03   # no new buys for the day after a 3% drawdown
  min_order_notional: 1.0      # Alpaca fractional minimum is $1
  allow_live: false            # flip ONLY after months of paper results

paper_bot:
  strategy: sma_crossover
  symbols: [SPY, QQQ, AAPL, MSFT, NVDA]   # stocks only for now
  close_unlisted: true   # sell positions in the paper account that aren't in `symbols`
