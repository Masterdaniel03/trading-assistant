# ---- Trading Assistant config ----
# Symbols use Yahoo Finance tickers (crypto: BTC-USD, ETH-USD).
watchlist: [SPY, QQQ, AAPL, MSFT, NVDA, BTC-USD]
benchmark: SPY
start_date: "2015-01-01"
db_path: data/trading.db

backtest:
  initial_capital: 4000      # mirrors the real stake
  cost_bps: 5                # assumed cost per trade (slippage + spread), in basis points

strategies:
  sma_crossover:
    fast: 50
    slow: 200
  rsi_reversion:
    period: 14
    buy_below: 30
    sell_above: 55
  momentum:
    lookback: 252
    skip: 21
  vol_target:
    target_vol: 0.15
    window: 20

# Out-of-sample testing: pick parameters on train_years, trade them on the next test_years.
walk_forward:
  train_years: 5
  test_years: 1
  grids:
    sma_crossover: {fast: [20, 50], slow: [100, 200]}
    rsi_reversion: {period: [7, 14], buy_below: [25, 30], sell_above: [50, 55, 70]}
    momentum: {lookback: [126, 252], skip: [0, 21]}
    vol_target: {target_vol: [0.10, 0.15, 0.20], window: [20, 60]}

# LLM research layer: reads recent news and writes a stance with reasons.
# Advisory only: notes are logged and scored, the bot does not trade on them.
research:
  # Tried in order. Each model has its own free quota (about 5 a minute and
  # 20 a day), so a busy or used-up model falls through to the next.
  models: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.5-flash, gemini-3.5-flash-lite]
  requests_per_minute: 5       # per model; calls are spaced to stay under it
  news_lookback_days: 3        # covers a weekend
  max_news_items: 12           # per symbol, most focused and newest first

# News test (research only): does past news predict the next session's move?
# The universe is the Dow 30 as it stood on the start date. Fixing the list up
# front means the choice of stocks uses no hindsight about who did well later.
news_test:
  start: "2020-01-01"
  universe: [AAPL, AXP, BA, CAT, CSCO, CVX, DIS, DOW, GS, HD, IBM, INTC, JNJ, JPM, KO,
             MCD, MMM, MRK, MSFT, NKE, PFE, PG, RTX, TRV, UNH, V, VZ, WBA, WMT, XOM]
  aliases: {UTX: RTX}          # old ticker -> today's, for news tagged before the rename
  archive_path: data/news_archive.db

# Hard limits enforced by the paper/live bot before any order is sent.
risk:
  max_position_pct: 0.20       # no single symbol above 20% of equity
  max_total_exposure_pct: 1.0  # no margin
  max_risk_per_position_pct: 0.015  # stop-loss = this / max_position_pct = 7.5%
  stop_cooldown_bars: 20       # after a stop, stay out of that symbol this many bars
  daily_loss_limit_pct: 0.03   # no new buys for the day after a 3% drawdown
  min_order_notional: 1.0      # Alpaca fractional minimum is $1
  allow_live: false            # flip ONLY after months of paper results

paper_bot:
  strategy: sma_crossover
  symbols: [SPY, QQQ, AAPL, MSFT, NVDA]   # stocks only for now
  close_unlisted: true   # sell positions in the paper account that aren't in `symbols`
